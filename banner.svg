<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="300" fill="#ffffff"/>

  <!-- Left cat -->
  <g transform="translate(90,150)" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail -->
    <path d="M 70 60 Q 130 40 120 -10 Q 112 -45 80 -35" />
    <!-- body -->
    <ellipse cx="0" cy="30" rx="55" ry="42" fill="#ffffff"/>
    <!-- head -->
    <circle cx="-10" cy="-45" r="38" fill="#ffffff"/>
    <!-- ears -->
    <path d="M -38 -70 L -48 -105 L -18 -80 Z" fill="#ffffff"/>
    <path d="M 14 -78 L 30 -110 L 24 -72 Z" fill="#ffffff"/>
    <!-- inner ears -->
    <path d="M -33 -76 L -38 -95 L -24 -80 Z" fill="none"/>
    <!-- face -->
    <circle cx="-24" cy="-46" r="3.5" fill="#111111" stroke="none"/>
    <circle cx="4" cy="-50" r="3.5" fill="#111111" stroke="none"/>
    <path d="M -12 -38 Q -8 -33 -4 -38" />
    <!-- whiskers -->
    <path d="M -30 -34 L -60 -38" />
    <path d="M -30 -28 L -60 -26" />
    <path d="M 6 -36 L 34 -42" />
    <path d="M 6 -30 L 34 -26" />
    <!-- front legs -->
    <path d="M -25 68 L -25 90" />
    <path d="M 10 70 L 10 92" />
  </g>

  <!-- Right cat (mirrored pose, curled) -->
  <g transform="translate(1110,160) scale(-1,1)" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail curled around -->
    <path d="M 65 55 Q 115 70 100 30 Q 90 0 60 10" />
    <!-- body -->
    <ellipse cx="0" cy="25" rx="55" ry="40" fill="#ffffff"/>
    <!-- head -->
    <circle cx="-8" cy="-48" r="36" fill="#ffffff"/>
    <!-- ears -->
    <path d="M -34 -72 L -42 -106 L -14 -80 Z" fill="#ffffff"/>
    <path d="M 12 -78 L 28 -108 L 22 -72 Z" fill="#ffffff"/>
    <!-- face -->
    <circle cx="-22" cy="-48" r="3.5" fill="#111111" stroke="none"/>
    <circle cx="4" cy="-52" r="3.5" fill="#111111" stroke="none"/>
    <path d="M -10 -40 Q -6 -35 -2 -40" />
    <!-- whiskers -->
    <path d="M -28 -36 L -58 -40" />
    <path d="M -28 -30 L -58 -28" />
    <path d="M 6 -38 L 32 -44" />
    <path d="M 6 -32 L 32 -28" />
    <!-- front legs, one raised (playful) -->
    <path d="M -24 62 Q -34 40 -20 30" />
    <path d="M 12 65 L 12 88" />
  </g>

  <!-- Center text -->
  <text x="600" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#111111">AI From Scratch</text>
  <text x="600" y="180" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#333333">No Libraries. No Shortcuts. No .fit() Until I Earn It.</text>

  <!-- small decorative stars -->
  <g fill="#111111">
    <text x="300" y="90" font-size="18">✦</text>
    <text x="880" y="95" font-size="18">✦</text>
    <text x="600" y="60" font-size="16" text-anchor="middle">✦</text>
  </g>
</svg>
